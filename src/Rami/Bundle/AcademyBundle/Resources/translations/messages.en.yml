rami:
  academy:
    ticket:
      entity_label: Ticket
      entity_plural_label: Tickets
      entity_description: Business support ticket handled from back-office.
      subject:
        label: Subject
        description: Short summary shown in ticket grids and forms.
      description:
        label: Description
        description: Detailed business context for the support request.
      status:
        label: Status
        description: Current lifecycle state of the ticket.
      priority:
        label: Priority
        description: Business urgency used for sorting and triage.
      created_at:
        label: Created at
        description: Date and time when the ticket was created.
      owner:
        label: Owner business unit
        description: Business unit that owns the ticket record.
      organization:
        label: Organization
        description: Organization scope used by Oro access control.
      assigned_to:
        label: Assigned to
        description: User currently responsible for processing the ticket.
      contact:
        label: Contact
        description: Related contact for contextual customer communication.
      account:
        label: Account
        description: Related account to align ticket with customer organization.
      workflow:
        label: Ticket workflow
        steps:
          open:
            label: Open
          in_progress:
            label: In progress
          resolved:
            label: Resolved
          closed:
            label: Closed
        transitions:
          start_progress:
            label: Start progress
          resolve:
            label: Resolve
          close:
            label: Close
          reopen:
            label: Reopen
    system_configuration:
      groups:
        ticket_settings:
          title: Ticket settings
      fields:
        default_sla_hours:
          label: Default SLA (hours)
          tooltip: Default SLA target (in hours) used for new tickets.
        default_priority:
          label: Default priority
          tooltip: Initial priority preselected when creating a ticket.
        notifications_enabled:
          label: Enable notifications
          tooltip: Enable business notification rules during ticket creation.
      choices:
        priority:
          low: Low
          medium: Medium
          high: High
          urgent: Urgent
